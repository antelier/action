name: Antelier
description: Checks PR claims against changed source, with cited evidence in one updated comment and Check.
author: Antelier
branding:
  icon: eye
  color: purple
inputs:
  data-root:
    description: Working directory for local evidence written by the check
    required: false
    default: ${{ github.workspace }}
runs:
  using: composite
  steps:
    - name: Run Antelier claim check
      shell: bash
      env:
        WORKLOOP_DATA_ROOT: ${{ inputs.data-root }}
        GITHUB_TOKEN: ${{ github.token }}
      run: node "$GITHUB_ACTION_PATH/dist/index.js"
