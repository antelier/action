name: Work Loop claim check
description: Checks what an agent's pull request claims against what its diff actually changed, and posts one sticky comment plus a Check run.
branding:
  icon: check-circle
  color: gray-dark
inputs:
  data-root:
    description: Working directory for local evidence written by the check
    required: false
    default: ${{ github.workspace }}
runs:
  using: composite
  steps:
    - name: Run Work Loop claim check
      shell: bash
      env:
        WORKLOOP_DATA_ROOT: ${{ inputs.data-root }}
        GITHUB_TOKEN: ${{ github.token }}
      run: node "$GITHUB_ACTION_PATH/dist/index.js"
