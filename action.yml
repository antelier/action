name: Antelier
description: Checks what an AI coding agent's pull request claims against what its diff actually changed. Every citation resolves to diff bytes. One sticky comment, one Check, no account.
author: Antelier
branding:
  icon: eye
  color: purple
inputs:
  data-root:
    description: Working directory for local evidence written by the check
    required: false
    default: ${{ github.workspace }}
runs:
  using: composite
  steps:
    - name: Run Antelier claim check
      shell: bash
      env:
        WORKLOOP_DATA_ROOT: ${{ inputs.data-root }}
        GITHUB_TOKEN: ${{ github.token }}
      run: node "$GITHUB_ACTION_PATH/dist/index.js"
